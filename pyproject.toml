[build-system]
# 77+ is needed for the SPDX `license` string and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-socket-auth"
dynamic = ["version"]  # read from django_socket_auth/__init__.py
description = "JWT authentication for Django Channels websockets using djangorestframework-simplejwt"
readme = "README.md"
requires-python = ">=3.10"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Blessed Sam", email = "oscarblessed04@gmail.com" },
]
maintainers = [
    { name = "Blessed Sam", email = "oscarblessed04@gmail.com" },
]

keywords = ["django", "channels", "websocket", "jwt", "simplejwt", "authentication"]

# Full list: https://pypi.org/classifiers/
# Only versions the test suite has actually been run on are listed; add more
# Django / Python versions here once you've tested them.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

dependencies = [
    "Django>=4.2",
    "channels>=4.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
]


[project.urls]
Homepage = "https://github.com/tech-priest-oscar/Django-Socket-Auth"
Documentation = "https://github.com/tech-priest-oscar/Django-Socket-Auth#readme"
Repository = "https://github.com/tech-priest-oscar/Django-Socket-Auth"
Issues = "https://github.com/tech-priest-oscar/Django-Socket-Auth/issues"
Changelog = "https://github.com/tech-priest-oscar/Django-Socket-Auth/releases"

[tool.setuptools]
# Only ship the package itself, not the tests.
packages = ["django_socket_auth"]

[tool.setuptools.dynamic]
version = { attr = "django_socket_auth.__version__" }
